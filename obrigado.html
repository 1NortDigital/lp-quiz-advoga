<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Cadastro recebido | 1Nort Advoga</title>
  <style>
    :root {
      color-scheme: dark;
      --background: #050807;
      --card: rgba(15, 26, 22, 0.96);
      --text: #f5fff9;
      --muted: #b4c8bd;
      --accent: #25d366;
      --accent-dark: #062c15;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at 50% 0%, rgba(37, 211, 102, 0.18), transparent 36%),
        linear-gradient(160deg, #07110d 0%, var(--background) 58%, #020302 100%);
      color: var(--text);
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main {
      width: min(100%, 560px);
      padding: 42px 28px 34px;
      text-align: center;
      background: var(--card);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 24px;
      box-shadow: 0 28px 80px rgba(0, 0, 0, 0.42);
    }

    .check {
      width: 72px;
      height: 72px;
      margin: 0 auto 22px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: var(--accent);
      color: var(--accent-dark);
      font-size: 38px;
      font-weight: 900;
      box-shadow: 0 14px 40px rgba(37, 211, 102, 0.28);
    }

    h1 {
      margin: 0;
      font-size: clamp(30px, 7vw, 44px);
      line-height: 1.05;
      letter-spacing: -0.04em;
    }

    p {
      margin: 18px auto 0;
      max-width: 440px;
      color: var(--muted);
      font-size: 18px;
      line-height: 1.55;
    }

    a {
      margin-top: 28px;
      min-height: 56px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 15px 24px;
      border-radius: 14px;
      background: var(--accent);
      color: var(--accent-dark);
      font-size: 17px;
      font-weight: 800;
      text-decoration: none;
      transition: transform 160ms ease, filter 160ms ease;
    }

    a:hover { transform: translateY(-2px); filter: brightness(1.06); }

    small {
      display: block;
      margin-top: 16px;
      color: #7f9589;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <main>
    <div class="check" aria-hidden="true">✓</div>
    <h1>Cadastro recebido!</h1>
    <p>Estamos te levando para o WhatsApp da 1Nort para continuar seu atendimento.</p>
    <a id="whatsapp" href="#" rel="noopener">Falar agora no WhatsApp</a>
    <small>Não abriu automaticamente? Toque no botão acima.</small>
  </main>

  <script>
    const phone = "5521974438531";
    const message = "Oi! Acabei de preencher o formulário da 1Nort Advoga e quero falar com um especialista.";
    const whatsappUrl = `https://wa.me/${phone}?text=${encodeURIComponent(message)}`;

    document.getElementById("whatsapp").href = whatsappUrl;
    window.setTimeout(() => window.location.replace(whatsappUrl), 1400);
  </script>
</body>
</html>
